[workspace]
members = [
  "libitis",
  "libpropagation",
  "pn"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
default-run = "pn"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
futures = "0.3.32"
geo = "0.33.1"
geojson = "1.0.0"
indicatif = "0.18.4"
inquire = "0.9.4"
itertools = "0.14.0"
jiff = { version = "0.2.24", features = ["serde"] }
libitis = { path = "./libitis" }
libpropagation = { path = "./libpropagation" }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
strum = { version = "0.28.0", features = ["derive"] }
tabled = "0.21.0"
thiserror = "2.0.18"
toasty = { version = "0.7.0", features = ["jiff", "sqlite", "serde"] }
toasty-cli = "0.7.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
