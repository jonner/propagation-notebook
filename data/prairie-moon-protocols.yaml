- name: Direct sow
  type: germination
  instructions: >
    No pre-treatment is necessary. Seeds should germinate upon sowing in a warm location.
  notes: This is code 'A' from prairie moon
- name: Hot Water Treatment
  type: pretreatment
  instructions: |
    1. Bring water to a boil, remove from heat, and pour over seeds.
    2. Soak the seeds at room temperature for 24 hours.
    3. Filter through a coffee filter and fine mesh strainer.
  notes: >
    This hot water treatment helps break open the hard seed coat. This may
    happen naturally with freeze/thaw cycles, but better germination can be
    expected if hot water treatment is done before fall planting outside, or
    artificial cold-moist stratification in a fridge

    This is code 'B' from prairie moon
- name: 10-day Cold, moist stratification
  type: pretreatment
  instructions: |
    1. Using our germination codes, calculate the date to start cold, moist stratification pre-treatment. Briefly give your seeds a soak in a container, and pour contents over a coffee filter, paper towel, and/or fine screen to drain.
    2. Arrange seed in a single layer and allow all excess water to drain off.
    3. Fold seed loosely into the coffee filter or paper towel to allow for weekly spot checks. The seed and paper should be damp but not wet.
    4. Add a dry paper towel to your labeled resealable bag to help to maintain even moisture while pulling excessive moisture away. Do not allow the stratification medium to completely dry out or stay soggy.
    5. Place the sealed bag in your refrigerator (not freezer) and monitor weekly, or as needed, until it is time to remove for sowing. Replace coffee filter or paper towel often; repeat from step 1. Once seed had completed the recommended stratification period, or if excessive early sprouting occurs, plant immediately.
  parameters:
    max_temp: 4.5
    duration: 30
  notes: >
    To naturally stratify seed, surface sow outdoors late fall on a bare
    (weed-free), compact site and allow seed to overwinter. If you are
    new to perennial seed starting, this would be the preferred method.
    To artificially stratify seed, place seed and seed starting medium in
    a labeled, sealed plastic bag and store in a refrigerator (33-40°F).
    Seed starting medium could be a damp paper towel, coffee filter, sand,
    vermiculite, or other horticultural-use medium.

    We recommend mixing equal parts sand and seed, or slightly more sand
    than seed. Whatever stratifying medium you choose, be sure to moisten
    the mixture slowly to a damp, but not wet, consistency. You should not
    be able to squeeze any excess water out of the medium.

    Stratify for 10 days. Some seeds may sprout in the storage bag. If this
    occurs with more than a few seeds, plant immediately.

    This is code 'C(10)' from prairie moon
